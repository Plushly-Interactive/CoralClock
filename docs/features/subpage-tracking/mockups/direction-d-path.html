<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mockup D — path.html</title>
  <script src="../../../src/shared/theme.js"></script>
  <link rel="stylesheet" href="../../../src/shared/theme.css" />
  <link rel="stylesheet" href="../../../src/pages/dashboard/dashboard.css" />
  <link rel="stylesheet" href="../../../src/pages/site/site.css" />
  <link rel="stylesheet" href="./_shared.css" />
  <style>
    #path-subheader {
      display: flex;
      align-items: center;
      padding: 0 24px;
      height: 32px;
      border-bottom: 1px solid var(--color-border);
      gap: 6px;
      flex-shrink: 0;
    }
    #path-crumb-site {
      color: var(--color-accent);
      font-size: var(--font-sm);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    #path-crumb-site:hover { color: var(--color-accent-light); }
    #path-crumb-sep { color: var(--color-text-secondary); font-size: var(--font-sm); }
    #path-crumb-path { font-size: var(--font-sm); font-family: ui-monospace, monospace; color: var(--color-text); }

    .mock-chart { cursor: pointer; }
    .mock-chart:hover::after {
      content: 'click to drill in';
      display: block;
      font-size: var(--font-sm);
      color: var(--color-accent);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <header>
    <div id="header-left">
      <a id="back-btn" href="direction-d-site.html" onclick="return onBack()">
        <img src="../../../resources/icons/biteguard-icon-blue-square-48px.png" width="24" height="24" alt="BiteGuard">
      </a>
    </div>
    <div id="header-center">
      <div id="site-title">
        <span id="site-label" class="site-label">reddit.com</span>
      </div>
      <div class="custom-dropdown">
        <button class="dropdown-btn" id="range-select">Last 7 days<span class="dropdown-arrow">▼</span></button>
        <div class="dropdown-menu">
          <button>Today</button>
          <button>Last 7 days</button>
          <button>Last 30 days</button>
          <button>Last 6 months</button>
          <button>Last year</button>
          <button>All time</button>
        </div>
      </div>
    </div>
  </header>

  <div id="path-subheader">
    <a id="path-crumb-site" href="direction-d-site.html">reddit.com</a>
    <span id="path-crumb-sep">/</span>
    <span id="path-crumb-path">r/programming</span>
  </div>

  <!-- Overview: charts grid -->
  <div id="charts-grid">
    <div id="time-chart-container" class="chart-container">
      <h2 class="chart-heading">Time spent</h2>
      <div class="mock-chart" onclick="openDrill('May 2025')">time chart</div>
    </div>
    <div id="stats-container" class="chart-container">
      <h2 class="chart-heading">Overview</h2>
      <div class="mock-stats">
        <div><div class="mock-stat-label">Total</div><div class="mock-stat-value">1h 42m</div></div>
        <div><div class="mock-stat-label">Avg/day</div><div class="mock-stat-value">14m</div></div>
        <div><div class="mock-stat-label">Visits</div><div class="mock-stat-value">23</div></div>
      </div>
    </div>
    <div id="hourly-chart-container" class="chart-container">
      <h2 class="chart-heading">Average per clock hour</h2>
      <div class="mock-chart" onclick="openDrill('12:00')">hourly chart</div>
    </div>
    <div id="visits-chart-container" class="chart-container">
      <h2 class="chart-heading">Visits</h2>
      <div class="mock-chart" onclick="openDrill('May 2025')">visits chart</div>
    </div>
  </div>

  <!-- Drill view: mirrors site.html #drill-view -->
  <div id="drill-view" style="display:none">
    <div id="drill-top">
      <button id="nav-close" class="link-btn" onclick="closeDrill()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Overview
      </button>
      <button id="drill-month-link" class="link-btn"></button>
    </div>
    <div id="drill-controls">
      <div id="nav-strip">
        <button id="nav-prev" class="link-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span id="nav-label">May 2025</span>
        <button id="nav-next" class="link-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
      <div id="drill-toggle">
        <button class="drill-toggle-btn active">Time</button>
        <button class="drill-toggle-btn">Visits</button>
        <button class="drill-toggle-btn">Hourly avg.</button>
      </div>
    </div>
    <div id="drill-chart-wrapper">
      <div class="mock-chart" style="position:absolute; inset:0; min-height:unset; border-radius:0;">
        drill chart — /r/programming · May 2025
      </div>
      <div id="drill-tooltip" class="tooltip text-meta"></div>
    </div>
  </div>

  <div class="mock-note">D — path.html · click a chart to drill · Overview to go back</div>

  <script>
    function onBack() {
      if (document.querySelector('#drill-view').style.display !== 'none') {
        closeDrill();
        return false;
      }
      return true;
    }

    function openDrill(label) {
      document.querySelector('#nav-label').textContent = label;
      document.querySelector('#charts-grid').style.display = 'none';
      document.querySelector('#drill-view').style.display = 'flex';
    }
    function closeDrill() {
      document.querySelector('#drill-view').style.display = 'none';
      document.querySelector('#charts-grid').style.display = 'grid';
    }
  </script>
</body>
</html>
