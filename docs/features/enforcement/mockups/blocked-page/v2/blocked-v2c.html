<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blocked – BiteGuard (mockup v2C)</title>
    <script src="../../../../../../src/shared/theme.js"></script>
    <link rel="stylesheet" href="../../../../../../src/shared/theme.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-bg);
        color: var(--color-text);
        padding: 24px;
      }

      #panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        max-width: 38rem;
        width: 100%;
        border: 1px solid var(--color-border);
        border-radius: 16px;
        overflow: hidden;
      }

      /* Left: the "what happened" side */
      #why {
        padding: 36px 28px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
      }

      #shark { font-size: 2.2rem; margin-bottom: 4px; }

      #headline {
        font-size: 1.3rem;
        font-weight: 600;
      }

      #target {
        color: var(--color-accent-light);
        font-weight: 600;
        font-size: var(--font-md);
        margin-bottom: 16px;
      }

      .stat-row {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 10px;
      }

      .stat-label {
        font-size: var(--font-sm);
        color: var(--color-text-secondary);
      }

      .stat-value {
        font-size: var(--font-md);
        font-weight: 600;
      }

      /* Right: the "when" side */
      #when {
        padding: 36px 28px;
        background: var(--color-accent);
        color: var(--color-button-text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
      }

      #countdown-label {
        font-size: var(--font-sm);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.7;
      }

      #countdown {
        font-size: 2.4rem;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin: 6px 0 4px;
      }

      #reset-note {
        font-size: var(--font-sm);
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <div id="why">
        <div id="shark">🦈</div>
        <div id="headline">Time's up</div>
        <div id="target">*.google.com</div>

        <div class="stat-row">
          <span class="stat-label">Spent today</span>
          <span class="stat-value">32m</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Limit</span>
          <span class="stat-value">30m / day</span>
        </div>
      </div>

      <div id="when">
        <div id="countdown-label">Unlocks in</div>
        <div id="countdown">—</div>
        <div id="reset-note" id="reset-note">at —</div>
      </div>
    </div>

    <script>
      function nextMidnight() {
        const d = new Date();
        d.setHours(24, 0, 0, 0);
        return d;
      }

      function formatCountdown(ms) {
        if (ms <= 0) return 'now';
        const totalSec = Math.floor(ms / 1000);
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        if (h > 0) return `${h}h ${m}m`;
        return `${m}m`;
      }

      const resetDate = nextMidnight();
      const cdEl = document.querySelector('#countdown');
      const noteEl = document.querySelector('#reset-note');

      noteEl.textContent = `at ${resetDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

      function tick() {
        cdEl.textContent = formatCountdown(resetDate - Date.now());
      }
      tick();
      setInterval(tick, 30000);
    </script>
  </body>
</html>
