<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BiteGuard — Blocked (mockup C)</title>
    <script src="../../../../src/shared/theme.js"></script>
    <link rel="stylesheet" href="../../../../src/shared/theme.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-align: center;
        padding: 24px;
        background: var(--color-accent);
        color: var(--color-button-text);
      }
      #shark { font-size: 4rem; line-height: 1; }
      #headline { font-size: 2rem; font-weight: 600; margin-top: 8px; }
      #sub { font-size: var(--font-md); opacity: 0.85; max-width: 26rem; }
      #sub strong { font-weight: 600; }

      /* Big reset countdown is the focal point. */
      #countdown-label { margin-top: 28px; font-size: var(--font-sm); text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.7; }
      #countdown { font-size: 2.4rem; font-weight: 700; }

      #limit-note { margin-top: 4px; font-size: var(--font-sm); opacity: 0.7; }
      #manage-link {
        margin-top: 28px;
        background: var(--color-bg);
        color: var(--color-text);
        border-color: var(--color-bg);
      }
    </style>
  </head>
  <body>
    <div id="shark">🦈</div>
    <div id="headline">Time for a break</div>
    <div id="sub">You've used your time on <strong>google.com</strong> for today.</div>

    <div id="countdown-label">Available again in</div>
    <div id="countdown">3h 24m</div>
    <div id="limit-note">Limit: 30m per day · counting active time</div>

    <a id="manage-link" class="btn" href="#">Manage rules</a>
  </body>
</html>
