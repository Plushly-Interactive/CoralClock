<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>BiteGuard</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <header>
    <div id="brand">
      <img id="brand-logo" src="resources/icons/biteguard-icon-blue-square-48px.png" alt="BiteGuard" />
      <span id="brand-name"><span class="brand-bite">Bite</span><span class="brand-guard">Guard</span></span>
    </div>
    <div id="popup-header-btns">
      <button id="dashboard-btn" class="btn">
        Dashboard
      </button>
      <div id="theme-menu">
        <button id="theme-btn" class="square-btn">
          <svg id="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <div id="theme-dropdown" class="dropdown-menu">
          <button value="system">System</button>
          <button value="light">Light</button>
          <button value="dark">Dark</button>
        </div>
      </div>
    </div>
  </header>

  <div id="rules-header">
    <h2 id="rules-title">Rules</h2>
    <button id="add-btn" class="btn">+ Add a rule</button>
  </div>

  <div id="add-form">
    <input id="form-target" type="text" placeholder="google.com" />
    <div class="form-row">
      <input id="form-limit" type="number" value="10" min="1" />
      <div class="custom-dropdown">
        <button class="dropdown-btn" id="form-unit-btn" data-value="minutes">min<span class="dropdown-arrow">▼</span></button>
        <div class="dropdown-menu" id="form-unit-menu">
          <button value="minutes">min</button>
          <button value="hours">hours</button>
          <button value="days">days</button>
        </div>
      </div>
      <span>per</span>
      <div class="custom-dropdown">
        <button class="dropdown-btn" id="form-period-btn" data-value="day">day<span class="dropdown-arrow">▼</span></button>
        <div class="dropdown-menu" id="form-period-menu">
          <button value="day">day</button>
          <button value="hour">hour</button>
          <button value="week">week</button>
        </div>
      </div>
    </div>
    <button id="save-btn" class="btn">Save</button>
  </div>

  <div id="no-rules-message"></div>
  <ul id="rules-list"></ul>

  <script type="module" src="popup.js"></script>
</body>

</html>
