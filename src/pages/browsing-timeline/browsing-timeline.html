<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="../../../resources/icons/brand/icon16.png" />
    <title>Timeline - CoralClock</title>
    <script src="../../shared/theme.js"></script>
    <link rel="stylesheet" href="../../shared/theme.css" />
    <link rel="stylesheet" href="../../shared/tour.css" />
    <link rel="stylesheet" href="./browsing-timeline.css" />
  </head>
  <body>
    <header>
      <div id="header-left">
        <a id="back-btn" tabindex="0" href="#">
          <img src="../../../resources/icons/brand/logo.svg" alt="CoralClock">
        </a>
      </div>
      <div id="header-center"><h1 class="page-title" data-i18n="tl_pageTitle">Browsing timeline</h1></div>
      <div id="header-right"></div>
    </header>

    <div id="tl-view">
      <div id="tl-top">
        <button id="tl-parent-link" class="link-btn" style="display:none"></button>
      </div>
      <div id="tl-controls">
        <label id="tl-clip-label" class="text-meta"><input type="checkbox" id="tl-clip"> <span data-i18n="tl_trimEmptyTime">Trim empty time</span></label>
        <div id="tl-nav" class="nav-strip">
          <button id="tl-prev" class="link-btn nav-arrow-btn" data-i18n-aria="tl_previousPeriod" aria-label="Previous period"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
          <span id="tl-label" class="nav-period-label"></span>
          <button id="tl-next" class="link-btn nav-arrow-btn" data-i18n-aria="tl_nextPeriod" aria-label="Next period"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
        </div>
        <span id="timeline-legend" class="text-meta">
          <span class="legend-swatch legend-active"></span> <span data-i18n="legend_active_lc">active</span>
          <span class="legend-swatch legend-audio"></span> <span data-i18n="legend_audio_lc">audio</span>
          <span class="legend-swatch legend-idle"></span> <span data-i18n="legend_idle">idle</span>
        </span>
      </div>
      <div id="tl-chart-wrapper">
        <button id="tl-keys-btn" class="square-btn">&times;</button>
        <div id="tl-keys-popup" class="tooltip text-meta">
          <div id="tl-keys-title" data-i18n="drill_keyboardShortcuts">Keyboard shortcuts</div>
          <div><kbd>←</kbd><kbd>→</kbd> <span data-i18n="drill_navigatePeriod">Navigate period</span></div>
          <div><kbd>↑</kbd> <span data-i18n="drill_goUpLevel">Go up one level (day → week → month)</span></div>
          <div><kbd>↓</kbd> <span data-i18n="drill_goToFirst">Go to first day / week with data</span></div>
          <div><kbd>Esc</kbd> <span data-i18n="tl_resetToToday">Reset to today</span></div>
        </div>
        <div id="tl-scroll">
          <svg id="timeline-chart"></svg>
        </div>
        <svg id="timeline-axis"></svg>
        <div class="tooltip text-meta" id="timeline-tooltip" hidden></div>
        <p id="timeline-empty" class="empty-msg text-meta" style="display:none" data-i18n="dashboard_noData">No data for this period.</p>
      </div>
    </div>

    <script type="module" src="./browsing-timeline.js"></script>
  </body>
</html>
