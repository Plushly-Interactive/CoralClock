<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Reef</title>
  <script src="../../shared/theme.js"></script>
  <link rel="stylesheet" href="../../shared/theme.css" />
  <link rel="stylesheet" href="../../shared/tour.css" />
  <link rel="stylesheet" href="../../shared/rules.css" />
  <link rel="stylesheet" href="./popup.css" />
</head>

<body>
  <header>
    <div id="brand">
      <span class="brand-word brand-bite">Reef</span>
      <img id="brand-logo" src="../../../resources/icons/brand/logo.svg" alt="ReefGuard" />
      <span class="brand-word brand-guard">Guard</span>
    </div>
    <div id="popup-header-btns">
      <div id="theme-menu">
        <button id="theme-btn" class="square-btn">
          <svg id="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <div id="theme-dropdown" class="dropdown-menu">
          <button value="system">System</button>
          <button value="light">Light</button>
          <button value="dark">Dark</button>
        </div>
      </div>
      <button id="dashboard-btn" class="btn">
        Dashboard
      </button>
    </div>
  </header>

  <div id="popup-body">
    <div id="stats-panel">
      <div id="stats-header">
        <h2 class="panel-title">Today's overview</h2>
        <span class="stat-value" id="stats-total-time">—</span>
      </div>
      <div id="stats-content">
      <svg id="stats-hour-chart"></svg>
      <div id="stats-grid">
        <div class="stat-cell">
          <span class="stat-label">Sites</span>
          <span class="stat-value" id="stats-sites-count">—</span>
        </div>
        <div class="stat-cell">
          <span class="stat-label">vs 7d avg</span>
          <span class="stat-value" id="stats-vs-avg">—</span>
        </div>
        <div class="stat-cell">
          <span class="stat-label">Peak hour</span>
          <span class="stat-value" id="stats-peak-hour">—</span>
        </div>
        <div class="stat-cell">
          <span class="stat-label">First browse</span>
          <span class="stat-value" id="stats-first-browse">—</span>
        </div>
        <div class="stat-cell">
          <span class="stat-label">Tab visits</span>
          <span class="stat-value" id="stats-sessions">—</span>
        </div>
        <div class="stat-cell">
          <span class="stat-label">Idle</span>
          <span class="stat-value" id="stats-idle">—</span>
        </div>
      </div>
      </div>
    </div>
    <div id="rules-panel">
      <div id="rules-header">
        <h2 id="rules-title" class="panel-title">Active rules</h2>
        <button id="manage-btn" class="btn">Manage rules</button>
      </div>
      <div id="no-rules-message"></div>
      <ul id="rules-list" class="rules-list"></ul>
    </div>
  </div>

  <div id="stats-chart-tooltip" hidden></div>
  <script type="module" src="./popup.js"></script>
</body>

</html>
