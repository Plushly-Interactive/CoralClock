<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reef — Path</title>
    <script src="../../shared/theme.js"></script>
    <link rel="stylesheet" href="../../shared/theme.css" />
    <link rel="stylesheet" href="../../shared/tour.css" />
    <link rel="stylesheet" href="../site/site.css" />
    <link rel="stylesheet" href="./path.css" />
  </head>
  <body>
    <header>
      <div id="header-left">
        <a id="back-btn" href="#">
          <img src="../../../resources/icons/logo.svg" alt="Reef">
        </a>
      </div>
      <div id="header-center">
        <img id="site-favicon" class="site-favicon" alt="" hidden>
        <div id="site-title">
          <span id="site-label" class="site-label"></span>
          <span id="site-id" class="text-meta"></span>
        </div>
      </div>
      <div id="header-right">
        <button id="limit-btn" class="btn">Limit this page</button>
      </div>
    </header>

    <div id="path-subheader">
      <a id="path-crumb-site" href="#"></a>
      <span class="path-crumb-link">
        <a id="path-crumb-path" class="text-meta" href="#" target="_blank" rel="noopener"></a>
        <button id="path-links-toggle" type="button" aria-expanded="false" style="display:none" title="Show open-link options"><span id="path-links-toggle-label" class="text-hint"></span></button>
      </span>
      <div id="path-links" class="text-meta"></div>
    </div>

    <div id="charts-grid">
      <div id="stats-container" class="chart-container">
        <h2 class="chart-heading">Overview <span id="overview-subheading" class="chart-subheading text-meta"></span></h2>
        <div id="stats-list" class="stats-list"></div>
      </div>
    </div>

    <div id="drill-view" style="display:none"></div>

    <script type="module" src="./path.js"></script>
  </body>
</html>
