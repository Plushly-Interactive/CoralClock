<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BiteGuard — Path</title>
    <script src="../../shared/theme.js"></script>
    <link rel="stylesheet" href="../../shared/theme.css" />
    <link rel="stylesheet" href="../dashboard/dashboard.css" />
    <link rel="stylesheet" href="../site/site.css" />
    <link rel="stylesheet" href="./path.css" />
  </head>
  <body>
    <header>
      <div id="header-left">
        <a id="back-btn" href="#">
          <img src="../../../resources/icons/biteguard-icon-blue-square-48px.png" width="24" height="24" alt="BiteGuard">
        </a>
      </div>
      <div id="header-center">
        <div id="site-title">
          <span id="site-label" class="site-label"></span>
          <span id="site-id" class="text-meta"></span>
        </div>
      </div>
    </header>

    <div id="path-subheader">
      <a id="path-crumb-site" href="#"></a>
      <span class="path-crumb-link">
        <a id="path-crumb-path" class="text-meta" href="#" target="_blank" rel="noopener"></a>
        <button id="path-links-toggle" type="button" aria-expanded="false" style="display:none" title="Show open-link options"><span id="path-links-toggle-label" class="text-hint"></span></button>
      </span>
      <div id="path-links" class="text-meta"></div>
    </div>

    <div id="charts-grid">
      <div id="time-chart-container" class="chart-container">
        <div style="display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px;">
          <h2 class="chart-heading" style="margin: 0;">Time spent</h2>
          <div id="time-legend" class="time-legend text-meta" style="display: none; margin-left: auto;"></div>
        </div>
        <svg id="time-chart" class="chart-svg"></svg>
        <div id="time-tooltip" class="tooltip text-meta"></div>
        <p id="time-no-data" class="chart-note" style="display:none">No data for this period.</p>
      </div>

      <div id="stats-container" class="chart-container">
        <h2 class="chart-heading">Overview <span id="overview-subheading" class="chart-subheading text-meta"></span></h2>
        <div id="stats-list"></div>
      </div>

      <div id="visits-chart-container" class="chart-container">
        <h2 class="chart-heading">Visits</h2>
        <svg id="visits-chart" class="chart-svg"></svg>
        <div id="visits-tooltip" class="tooltip text-meta"></div>
        <p id="visits-no-data" class="chart-note" style="display:none">No data for this period.</p>
      </div>

      <div id="hourly-chart-container" class="chart-container">
        <h2 class="chart-heading">Average per clock hour <span id="hourly-subheading" class="chart-subheading text-meta"></span></h2>
        <svg id="hourly-chart" class="chart-svg"></svg>
        <div id="hourly-tooltip" class="tooltip text-meta"></div>
        <p id="hourly-not-relevant" class="chart-note" style="display:none"></p>
      </div>
    </div>

    <div id="drill-view" style="display:none"></div>

    <script type="module" src="./path.js"></script>
  </body>
</html>
