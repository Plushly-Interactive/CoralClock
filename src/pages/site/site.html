<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BiteGuard — Site</title>
    <script src="../../shared/theme.js"></script>
    <link rel="stylesheet" href="../../shared/theme.css" />
    <link rel="stylesheet" href="../../shared/tour.css" />
    <link rel="stylesheet" href="./site.css" />
  </head>
  <body>
    <header>
      <div id="header-left">
        <a id="back-btn" href="../dashboard/dashboard.html">
          <img src="../../../resources/icons/biteguard-icon-blue-square-48px.png" width="24" height="24" alt="BiteGuard">
        </a>
      </div>
      <div id="header-center">
        <div id="site-title">
          <span id="site-label" class="site-label"></span>
          <span id="site-id" class="text-meta"></span>
        </div>
      </div>
      <div id="header-right">
        <button id="limit-btn" class="btn">Limit this site</button>
      </div>
    </header>

    <div id="charts-grid">
      <div id="time-chart-container" class="chart-container">
        <div class="chart-header">
          <h2 class="chart-heading">Time spent</h2>
          <div id="time-legend" class="time-legend text-meta" style="display: none"></div>
        </div>
        <svg id="time-chart" class="chart-svg"></svg>
        <div id="time-tooltip" class="tooltip text-meta"></div>
        <p id="time-no-data" class="text-meta" style="display:none">No data for this period.</p>
      </div>

      <div id="stats-container" class="chart-container">
        <h2 class="chart-heading">Overview <span id="overview-subheading" class="chart-subheading text-meta"></span></h2>
        <div id="stats-list"></div>
        <div class="tooltip text-meta" id="peak-tooltip"></div>
      </div>

      <div id="visits-chart-container" class="chart-container">
        <h2 class="chart-heading">Visits</h2>
        <svg id="visits-chart" class="chart-svg"></svg>
        <div id="visits-tooltip" class="tooltip text-meta"></div>
        <p id="visits-no-data" class="text-meta" style="display:none">No data for this period.</p>
      </div>

      <div id="subpages-container" class="chart-container">
        <div id="subpages-header">
          <h2 class="chart-heading" id="subpages-heading">Page activity
            <label id="hide-brief-subpages-label" class="table-filter text-meta">
              <input type="checkbox" id="hide-brief-subpages-toggle" checked> Hide brief (&lt;1m)
            </label>
          </h2>
        </div>
        <div id="subpages-controls">
          <span class="text-meta">Depth</span>
          <div id="depth-toggle"></div>
          <div id="sort-toggle">
            <button id="sort-time-btn" class="seg-btn active">Time</button>
            <button id="sort-visits-btn" class="seg-btn">Visits</button>
          </div>
        </div>
        <ol id="subpages-list"></ol>
        <div id="subpages-footer" class="table-footer">
          <span id="subpages-count" class="text-meta"></span>
          <label id="strip-params-label" class="table-filter text-meta">
            <input type="checkbox" id="strip-params-toggle" checked> Ignore URL params
          </label>
        </div>
      </div>

      <div id="hourly-chart-container" class="chart-container">
        <h2 class="chart-heading">Average per clock hour <span id="hourly-subheading" class="chart-subheading text-meta"></span></h2>
        <svg id="hourly-chart" class="chart-svg"></svg>
        <div id="hourly-tooltip" class="tooltip text-meta"></div>
        <p id="hourly-not-relevant" class="text-meta" style="display:none"></p>
      </div>
    </div>

    <div id="drill-view" style="display:none"></div>

    <script type="module" src="./site.js"></script>
  </body>
</html>
