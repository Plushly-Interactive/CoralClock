<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="../../../resources/icons/brand/icon16.png" />
    <title>Blocked - Reeflect</title>
    <script src="../../shared/theme.js"></script>
    <link rel="stylesheet" href="../../shared/theme.css" />
    <link rel="stylesheet" href="./blocked.css" />
  </head>
  <body>
    <div id="card">
      <img id="logo" alt="Reeflect" />
      <div id="headline" data-i18n="blocked_timesUp">Time's up</div>
      <div id="target"></div>

      <div id="stats-grid" class="stats-list">
        <div class="stat-item">
          <span class="stat-label" data-i18n="blocked_spentToday">Spent today</span>
          <span class="stat-value" id="stat-spent">—</span>
        </div>
        <div class="stat-item">
          <span class="stat-label" data-i18n="blocked_limit">Limit</span>
          <span class="stat-value" id="stat-limit">—</span>
        </div>
        <hr id="stats-divider">
        <div class="stat-item">
          <span class="stat-label" data-i18n="blocked_visitsToday">Visits today</span>
          <span class="stat-value" id="stat-visits">—</span>
        </div>
        <div class="stat-item">
          <span class="stat-label" data-i18n="blocked_unlocksIn">Unlocks in</span>
          <span class="stat-value" id="stat-countdown">—</span>
        </div>
      </div>

      <p id="quote" hidden><span id="quote-text"></span><span id="quote-author-wrapper"></span></p>
      <div id="quote-actions" hidden>
        <button id="fav-btn">
          <svg id="fav-icon" width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 20.5C12 20.5 2.5 14.5 2.5 8C2.5 5.5 4.5 3.5 7 3.5C9 3.5 10.8 4.7 12 6.5C13.2 4.7 15 3.5 17 3.5C19.5 3.5 21.5 5.5 21.5 8C21.5 14.5 12 20.5 12 20.5Z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
          </svg>
        </button>
        <a id="saved-quotes-link" class="link-muted" tabindex="0" href="../quotes/quotes.html" data-i18n="blocked_viewSaved">View saved ↗</a>
      </div>
    </div>
    <script type="module" src="./blocked.js"></script>
  </body>
</html>
