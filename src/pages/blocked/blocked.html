<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blocked – BiteGuard</title>
    <script src="../../shared/theme.js"></script>
    <link rel="stylesheet" href="../../shared/theme.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-accent);
        color: var(--color-button-text);
      }

      #card {
        text-align: center;
        max-width: 26rem;
        width: 100%;
        margin: 24px;
        padding: 36px 32px 32px;
        border: 1px solid var(--color-border);
        border-radius: 16px;
        background: var(--color-bg);
        color: var(--color-text);
      }

      #logo {
        width: 48px;
        height: 48px;
        object-fit: contain;
        margin-bottom: 14px;
      }

      #headline {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 4px;
      }

      #target {
        font-size: var(--font-md);
        color: var(--color-accent-light);
        font-weight: 600;
        margin-bottom: 28px;
      }

      #stats-grid {
        grid-template-columns: repeat(2, auto);
        margin-bottom: 28px;
      }

      #quote {
        font-size: var(--font-sm);
        color: var(--color-text-secondary);
        font-style: italic;
        line-height: 1.5;
        max-width: 22rem;
        margin: 0 auto;
      }

      #quote-author {
        display: block;
        margin-top: 4px;
        font-style: normal;
        font-size: var(--font-sm);
        color: var(--color-text-secondary);
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <img id="logo" alt="BiteGuard" />
      <div id="headline">Time's up</div>
      <div id="target"></div>

      <div id="stats-grid" class="stats-list">
        <div class="stat-item">
          <span class="stat-label">Spent today</span>
          <span class="stat-value" id="stat-spent">—</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Limit</span>
          <span class="stat-value" id="stat-limit">—</span>
        </div>
        <hr id="stats-divider">
        <div class="stat-item">
          <span class="stat-label">Visits today</span>
          <span class="stat-value" id="stat-visits">—</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Unlocks in</span>
          <span class="stat-value" id="stat-countdown">—</span>
        </div>
      </div>

      <p id="quote" hidden><span id="quote-text"></span><span id="quote-author"></span></p>
    </div>
    <script type="module" src="./blocked.js"></script>
  </body>
</html>
