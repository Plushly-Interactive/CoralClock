<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blocked – BiteGuard</title>
    <script src="../../shared/theme.js"></script>
    <link rel="stylesheet" href="../../shared/theme.css" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: var(--color-accent-light);
        color: var(--color-text);
      }
      h1 { font-size: 2rem; margin-bottom: 8px; }
      p { color: var(--color-text-secondary); margin: 0; }
      #detail { margin-top: 12px; max-width: 32rem; text-align: center; }
      #reset { margin-top: 4px; }
      #manage-link { margin-top: 24px; }
    </style>
  </head>
  <body>
    <h1>🦈 Time's up</h1>
    <p id="msg">You've reached your limit.</p>
    <p id="detail" class="text-meta" hidden></p>
    <p id="reset" class="text-meta" hidden></p>
    <button id="manage-link" class="btn" type="button">Manage rules</button>
    <script type="module" src="./blocked.js"></script>
  </body>
</html>
