<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blocked – BiteGuard</title>
    <script src="../../shared/theme.js"></script>
    <link rel="stylesheet" href="../../shared/theme.css" />
    <link rel="stylesheet" href="./blocked.css" />
  </head>
  <body>
    <div id="card">
      <img id="logo" alt="BiteGuard" />
      <div id="headline">Time's up</div>
      <div id="target"></div>

      <div id="stats-grid" class="stats-list">
        <div class="stat-item">
          <span class="stat-label">Spent today</span>
          <span class="stat-value" id="stat-spent">—</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Limit</span>
          <span class="stat-value" id="stat-limit">—</span>
        </div>
        <hr id="stats-divider">
        <div class="stat-item">
          <span class="stat-label">Visits today</span>
          <span class="stat-value" id="stat-visits">—</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Unlocks in</span>
          <span class="stat-value" id="stat-countdown">—</span>
        </div>
      </div>

      <p id="quote" hidden><span id="quote-text"></span><span id="quote-author-wrapper"></span></p>
    </div>
    <script type="module" src="./blocked.js"></script>
  </body>
</html>
