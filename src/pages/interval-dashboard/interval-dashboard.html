<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BiteGuard — Interval dashboard</title>
    <script src="../../shared/theme.js"></script>
    <link rel="stylesheet" href="../../shared/theme.css" />
    <link rel="stylesheet" href="../dashboard/dashboard.css" />
    <link rel="stylesheet" href="./interval-dashboard.css" />
  </head>
  <body>
    <header>
      <div id="header-left">
        <div id="brand">
          <img id="brand-logo" src="../../../resources/icons/biteguard-icon-blue-square-48px.png" alt="BiteGuard" />
          <span id="brand-name"><span class="brand-bite">Bite</span><span class="brand-guard">Guard</span></span>
        </div>
        <span id="interval-badge" class="text-meta">interval data</span>
      </div>
      <div id="header-center"></div>
      <div id="header-right">
        <span id="storage-bar-label" class="text-meta"></span>
        <button id="timeline-btn" class="btn">Timeline</button>
        <button id="prune-btn" class="btn">Manage storage</button>
        <button id="rules-btn" class="btn" type="button">Manage rules</button>
        <button id="settings-btn" class="square-btn" title="Settings">⛭</button>
      </div>
    </header>

    <div id="dashboard-grid">
      <div id="dashboard-charts-col">
        <div class="chart-container" id="top-chart-container">
          <h2 class="chart-heading">Top 5 sites <span id="top-subheading" class="chart-subheading text-meta"></span></h2>
          <svg id="top-chart" class="chart-svg"></svg>
          <div class="tooltip text-meta" id="top-tooltip"></div>
          <p id="top-not-relevant" class="text-meta" style="display:none"></p>
        </div>

        <div class="chart-container" id="hourly-chart-container">
          <h2 class="chart-heading">
            Average per clock hour
            <span id="hourly-subheading" class="chart-subheading text-meta"></span>
          </h2>
          <svg id="hourly-chart" class="chart-svg"></svg>
          <div class="tooltip text-meta" id="hourly-tooltip"></div>
          <p id="hourly-not-relevant" class="text-meta" style="display:none"></p>
        </div>
      </div>

      <div id="dashboard-table-col" class="chart-container">
        <h2 class="chart-heading" id="dashboard-table-heading">
          All browsed sites
          <label id="hide-brief-label" class="table-filter text-meta"><input type="checkbox" id="hide-brief-toggle" checked> Hide brief (&lt;1m)</label>
        </h2>
        <div id="site-search-wrap" class="input-wrap">
          <input type="search" id="site-search" class="text-input" placeholder="Search sites…" autocomplete="off">
          <button id="site-search-clear" class="icon-btn input-clear" aria-label="Clear search" hidden>&times;</button>
        </div>
        <table id="dashboard-table" class="data-table data-table--scroll">
          <thead>
            <tr>
              <th id="th-name">Site</th>
              <th id="th-time">Active time</th>
              <th id="th-audio">Audio playback</th>
              <th id="th-visits">Visits</th>
            </tr>
          </thead>
          <tbody id="dashboard-body"></tbody>
        </table>
        <p id="empty-msg" class="empty-msg text-meta">No data for this period.</p>
        <div id="dashboard-footer" class="table-footer">
          <span id="entries-count" class="text-meta"></span>
          <div id="dashboard-footer-toggles">
            <label id="group-label" class="table-filter text-meta"><input type="checkbox" id="group-toggle"> Group subdomains</label>
            <label id="merge-label" class="table-filter text-meta"><input type="checkbox" id="merge-toggle"> Merge by name</label>
          </div>
        </div>
      </div>
    </div>

    <div id="notification" hidden></div>

    <script type="module" src="./interval-dashboard.js"></script>
  </body>
</html>
