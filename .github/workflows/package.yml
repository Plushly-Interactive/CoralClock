name: Package Extension

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP
        run: zip -r reeflect.zip manifest.json src/ resources/ _locales/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: reeflect.zip
          generate_release_notes: true
