<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BiteGuard Analytics</title>
    <link rel="stylesheet" href="analytics.css" />
  </head>
  <body>
    <header>
      <span>🦈 BiteGuard — Analytics</span>
      <select id="range-select">
        <option value="today">Today</option>
        <option value="7" selected>Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="180">Last 6 months</option>
        <option value="365">Last year</option>
        <option value="all">All time</option>
      </select>
    </header>

    <div class="chart-container" id="top-chart-container">
      <h2 class="chart-heading">Top 5 sites</h2>
      <svg id="top-chart"></svg>
      <div class="tooltip" id="top-tooltip"></div>
    </div>

    <div class="chart-container" id="hourly-chart-container">
      <h2 class="chart-heading">
        Average per clock hour
        <span id="hourly-subheading" class="chart-subheading"></span>
      </h2>
      <svg id="hourly-chart"></svg>
      <div class="tooltip" id="hourly-tooltip"></div>
      <p id="hourly-not-relevant" class="chart-note" style="display:none">Not relevant for "Today".</p>
    </div>

    <table id="analytics-table">
      <thead>
        <tr>
          <th>Site</th>
          <th>Time</th>
          <th>Visits</th>
        </tr>
      </thead>
      <tbody id="analytics-body"></tbody>
    </table>

    <p id="empty-msg">No data for this period.</p>

    <footer>
      <button id="seed-btn">Seed test data</button>
    </footer>
    <script type="module" src="analytics.js"></script>
  </body>
</html>
