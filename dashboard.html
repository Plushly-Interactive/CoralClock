<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BiteGuard Analytics</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <header>
      <span>🦈 BiteGuard — Dashboard</span>
      <select id="range-select">
        <option value="today">Today</option>
        <option value="7" selected>Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="180">Last 6 months</option>
        <option value="365">Last year</option>
        <option value="all">All time</option>
      </select>
      <div id="header-right">
        <input type="file" id="import-input" accept=".json" style="display:none">
        <button id="import-btn">Import</button>
        <div id="storage-bar-container">
          <div id="storage-bar-track">
            <div id="storage-bar-fill"></div>
          </div>
          <span id="storage-bar-label"></span>
        </div>
      </div>
    </header>

    <div id="dashboard-grid">
      <div id="dashboard-charts-col">
        <div class="chart-container" id="top-chart-container">
          <h2 class="chart-heading">Top 5 sites</h2>
          <svg id="top-chart"></svg>
          <div class="tooltip" id="top-tooltip"></div>
        </div>

        <div class="chart-container" id="hourly-chart-container">
          <h2 class="chart-heading">
            Average per clock hour
            <span id="hourly-subheading" class="chart-subheading"></span>
          </h2>
          <svg id="hourly-chart"></svg>
          <div class="tooltip" id="hourly-tooltip"></div>
          <p id="hourly-not-relevant" class="chart-note" style="display:none">Not relevant for "Today".</p>
        </div>
      </div>

      <div id="dashboard-table-col">
        <h2 class="chart-heading" id="dashboard-table-heading">All browsed sites</h2>
        <table id="dashboard-table">
          <thead>
            <tr>
              <th id="th-name">Site</th>
              <th id="th-time">Time</th>
              <th id="th-visits">Visits</th>
            </tr>
          </thead>
          <tbody id="dashboard-body"></tbody>
        </table>
        <p id="empty-msg">No data for this period.</p>
      </div>
    </div>

    <script type="module" src="importData.js"></script>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
